# Especificación OpenAPI 3.0 de la API de Horas Pagas.
# Swagger UI lee este archivo y genera el portal interactivo que se publica en /api-docs.
openapi: 3.0.0

info:
  title: API de Horas Pagas
  version: 1.0.0
  description: |
    Calcula **cuánto cobra cada empleado** según las horas que trabajó, el rol que tiene
    y si hizo horas extra.

    ## Cómo se calcula el pago

    | Horas del día | Cómo se pagan |
    | --- | --- |
    | Hasta 8 horas | Al valor normal de la hora |
    | Más de 8 horas | Valor de la hora × **1,5** (recargo del 50 %) |

    El valor de la hora sale del **rol** del empleado.

    **Ejemplo:** un Administrativo ($4.000 la hora) que trabaja 9 horas cobra
    `8 × 4.000 + 1 × 4.000 × 1,5 = $38.000`.

    > Cada empleado puede tener **un solo registro por día**. Así las horas extra
    > siempre se calculan sobre la jornada completa.

    ## Cómo probarla en 3 pasos

    1. En **Empleados**, ejecutá `GET /empleados` y copiá el `_id` numérico de uno.
    2. En **Registros de horas**, ejecutá `POST /registros-horas` con ese `_id`.
    3. Mirá el pago en `calculo.totalPagar` de la respuesta.

    ## Formato de las respuestas

    | Resultado | Formato |
    | --- | --- |
    | Éxito | `{ "status": "success", "data": ... }` |
    | Error | `{ "status": "error", "message": "...", "errors": [...] }` |

    ## Códigos de estado

    | Código | Significado |
    | --- | --- |
    | `200` | Consulta, modificación o eliminación correcta |
    | `201` | Recurso creado |
    | `400` | Datos inválidos, ID mal formado, valor duplicado o regla de integridad |
    | `404` | El recurso no existe |
    | `500` | Error interno del servidor |

    > **Cómo leer las respuestas.** La lista *Responses* de cada endpoint muestra
    > todas las respuestas que ese endpoint **puede** devolver según su contrato
    > (`200`, `400`, `404`, `500`, ...). No son las que devolvió tu prueba.
    > Al ejecutar con **Try it out → Execute**, la respuesta real aparece debajo,
    > en **Server response**. Por ejemplo, `GET /empleados/3` devuelve `200`: ese
    > es el código que vas a ver en *Server response*, mientras que los demás
    > siguen listados solo como referencia.

  license:
    name: ISC

externalDocs:
  description: Repositorio en GitHub
  url: https://github.com/FzJw-06/Parcial-Laboratorio

servers:
  - url: http://localhost:3000/api/v1
    description: Servidor de desarrollo local

# El orden de esta lista es el orden en que Swagger UI muestra los grupos
tags:
  - name: Roles
    description: |
      Cada rol define el **valor de la hora**. Se crean primero, porque cada empleado tiene uno.
  - name: Empleados
    description: |
      Las personas a las que se les paga. Cada empleado tiene un **rol** y un **DNI único**.
  - name: Registros de horas
    description: |
      Las horas trabajadas por día. Cada respuesta incluye el **cálculo del pago**.

paths:
  # ---------------------------------------------------------------- ROLES
  /roles:
    get:
      summary: Listar roles
      description: Devuelve todos los roles ordenados por nombre.
      tags: [Roles]
      responses:
        "200":
          description: Lista de roles
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaRoles"
        "500":
          $ref: "#/components/responses/ErrorInterno"
    post:
      summary: Crear un rol
      description: El nombre del rol es único.
      tags: [Roles]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NuevoRol"
      responses:
        "201":
          description: Rol creado correctamente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaRol"
        "400":
          description: Datos inválidos o nombre de rol repetido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaError"
              examples:
                validacion:
                  summary: Dato inválido
                  value:
                    status: error
                    message: Error de validación
                    errors:
                      - campo: valorHora
                        mensaje: El valor por hora no puede ser negativo
                duplicado:
                  summary: El rol ya existe
                  value:
                    status: error
                    message: Ya existe un registro con ese valor
                    errors:
                      - campo: nombre
                        mensaje: Ya existe un registro con ese valor
        "500":
          $ref: "#/components/responses/ErrorInterno"

  /roles/{id}:
    get:
      summary: Obtener un rol
      tags: [Roles]
      parameters:
        - $ref: "#/components/parameters/IdRuta"
      responses:
        "200":
          description: Rol encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaRol"
        "400":
          $ref: "#/components/responses/IdInvalido"
        "404":
          $ref: "#/components/responses/NoEncontrado"
        "500":
          $ref: "#/components/responses/ErrorInterno"
    put:
      summary: Reemplazar un rol
      description: Reemplaza los datos del rol. Hay que enviar todos los campos.
      tags: [Roles]
      parameters:
        - $ref: "#/components/parameters/IdRuta"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NuevoRol"
      responses:
        "200":
          description: Rol actualizado correctamente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaRol"
        "400":
          $ref: "#/components/responses/DatosInvalidos"
        "404":
          $ref: "#/components/responses/NoEncontrado"
        "500":
          $ref: "#/components/responses/ErrorInterno"
    delete:
      summary: Eliminar un rol
      description: |
        No se puede eliminar un rol que tenga **empleados asignados** (responde `400`).
      tags: [Roles]
      parameters:
        - $ref: "#/components/parameters/IdRuta"
      responses:
        "200":
          description: Rol eliminado. Devuelve el rol que se borró.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaRol"
        "400":
          description: ID mal formado o rol con empleados asignados
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaError"
              example:
                status: error
                message: No se puede eliminar el rol porque hay empleados que lo tienen asignado
                errors: []
        "404":
          $ref: "#/components/responses/NoEncontrado"
        "500":
          $ref: "#/components/responses/ErrorInterno"

  # ------------------------------------------------------------ EMPLEADOS
  /empleados:
    get:
      summary: Listar empleados
      description: Ordenados por apellido. Cada empleado trae su **rol completo**.
      tags: [Empleados]
      responses:
        "200":
          description: Lista de empleados
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaEmpleados"
        "500":
          $ref: "#/components/responses/ErrorInterno"
    post:
      summary: Crear un empleado
      description: |
        El `rolId` tiene que ser el `_id` de un rol existente (sacalo de `GET /roles`).
        El DNI es único.
      tags: [Empleados]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NuevoEmpleado"
      responses:
        "201":
          description: Empleado creado correctamente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaEmpleado"
        "400":
          description: Datos inválidos, rol inexistente o DNI repetido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaError"
              examples:
                validacion:
                  summary: Dato inválido
                  value:
                    status: error
                    message: Error de validación
                    errors:
                      - campo: dni
                        mensaje: El DNI debe tener 7 u 8 dígitos
                rolInexistente:
                  summary: El rol no existe
                  value:
                    status: error
                    message: El rol indicado no existe
                    errors: []
                dniRepetido:
                  summary: DNI ya cargado
                  value:
                    status: error
                    message: Ya existe un registro con ese valor
                    errors:
                      - campo: dni
                        mensaje: Ya existe un registro con ese valor
        "500":
          $ref: "#/components/responses/ErrorInterno"

  /empleados/{id}:
    get:
      summary: Obtener un empleado
      tags: [Empleados]
      parameters:
        - $ref: "#/components/parameters/IdRuta"
      responses:
        "200":
          description: Empleado encontrado, con su rol
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaEmpleado"
        "400":
          $ref: "#/components/responses/IdInvalido"
        "404":
          $ref: "#/components/responses/NoEncontrado"
        "500":
          $ref: "#/components/responses/ErrorInterno"
    put:
      summary: Reemplazar un empleado
      description: Reemplaza los datos del empleado. Hay que enviar todos los campos.
      tags: [Empleados]
      parameters:
        - $ref: "#/components/parameters/IdRuta"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NuevoEmpleado"
      responses:
        "200":
          description: Empleado actualizado correctamente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaEmpleado"
        "400":
          $ref: "#/components/responses/DatosInvalidos"
        "404":
          $ref: "#/components/responses/NoEncontrado"
        "500":
          $ref: "#/components/responses/ErrorInterno"
    delete:
      summary: Eliminar un empleado
      description: |
        No se puede eliminar un empleado que tenga **registros de horas** (responde `400`).
      tags: [Empleados]
      parameters:
        - $ref: "#/components/parameters/IdRuta"
      responses:
        "200":
          description: Empleado eliminado. Devuelve el empleado que se borró.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaEmpleadoEliminado"
        "400":
          description: ID mal formado o empleado con registros de horas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaError"
              example:
                status: error
                message: No se puede eliminar el empleado porque tiene registros de horas asociados
                errors: []
        "404":
          $ref: "#/components/responses/NoEncontrado"
        "500":
          $ref: "#/components/responses/ErrorInterno"

  # ----------------------------------------------------- REGISTROS DE HORAS
  /registros-horas:
    get:
      summary: Listar registros de horas
      description: Del más reciente al más antiguo. Cada registro trae el **cálculo de su pago**.
      tags: [Registros de horas]
      responses:
        "200":
          description: Lista de registros con su cálculo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaRegistros"
        "500":
          $ref: "#/components/responses/ErrorInterno"
    post:
      summary: Cargar horas trabajadas
      description: |
        Guarda las horas de un empleado en un día y **calcula el pago** con el valor de hora
        de su rol.

        - Reemplazá `empleadoId` por el `_id` de un empleado real (`GET /empleados`).
        - Un empleado solo puede tener **un registro por día**.
        - Si el empleado no existe o no tiene rol, responde `400` y no se guarda nada.
      tags: [Registros de horas]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NuevoRegistroHoras"
            examples:
              jornadaNormal:
                summary: Jornada normal (8 horas)
                value:
                  empleadoId: 1
                  fecha: "2026-11-02"
                  horasTrabajadas: 8
              conHorasExtra:
                summary: Con horas extra (10 horas)
                value:
                  empleadoId: 1
                  fecha: "2026-11-03"
                  horasTrabajadas: 10
      responses:
        "201":
          description: Registro creado, con el cálculo del pago
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaRegistro"
        "400":
          description: Datos inválidos, empleado inexistente o día ya cargado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaError"
              examples:
                validacion:
                  summary: Dato inválido
                  value:
                    status: error
                    message: Error de validación
                    errors:
                      - campo: horasTrabajadas
                        mensaje: No se pueden registrar más de 24 horas por día
                empleadoInexistente:
                  summary: El empleado no existe
                  value:
                    status: error
                    message: No se encontró el empleado
                    errors: []
                diaRepetido:
                  summary: Ese empleado ya tiene horas cargadas ese día
                  value:
                    status: error
                    message: Ya existe un registro con ese valor
                    errors:
                      - campo: empleadoId
                        mensaje: Ya existe un registro con ese valor
                      - campo: fecha
                        mensaje: Ya existe un registro con ese valor
        "500":
          $ref: "#/components/responses/ErrorInterno"

  /registros-horas/{id}:
    get:
      summary: Obtener un registro
      tags: [Registros de horas]
      parameters:
        - $ref: "#/components/parameters/IdRuta"
      responses:
        "200":
          description: Registro encontrado, con el cálculo del pago
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaRegistro"
        "400":
          $ref: "#/components/responses/IdInvalido"
        "404":
          $ref: "#/components/responses/NoEncontrado"
        "500":
          $ref: "#/components/responses/ErrorInterno"
    put:
      summary: Reemplazar un registro
      description: |
        Verifica que el registro, el empleado y su rol existan, y **recalcula el pago**.
        Hay que enviar todos los campos.
      tags: [Registros de horas]
      parameters:
        - $ref: "#/components/parameters/IdRuta"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NuevoRegistroHoras"
      responses:
        "200":
          description: Registro actualizado, con el cálculo del pago
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaRegistro"
        "400":
          $ref: "#/components/responses/DatosInvalidos"
        "404":
          $ref: "#/components/responses/NoEncontrado"
        "500":
          $ref: "#/components/responses/ErrorInterno"
    delete:
      summary: Eliminar un registro
      tags: [Registros de horas]
      parameters:
        - $ref: "#/components/parameters/IdRuta"
      responses:
        "200":
          description: Registro eliminado. Devuelve el registro que se borró.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaRegistroEliminado"
        "400":
          $ref: "#/components/responses/IdInvalido"
        "404":
          $ref: "#/components/responses/NoEncontrado"
        "500":
          $ref: "#/components/responses/ErrorInterno"

components:
  # Parámetro de ruta que se reutiliza en todos los endpoints con /{id}
  parameters:
    IdRuta:
      name: id
      in: path
      required: true
      description: "`_id` numérico y autoincremental del documento (1, 2, 3, ...)"
      schema:
        type: integer
        example: 1

  # Respuestas de error que se reutilizan en varios endpoints
  responses:
    DatosInvalidos:
      description: Datos inválidos, ID mal formado o regla de negocio incumplida
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RespuestaError"
          example:
            status: error
            message: Error de validación
            errors:
              - campo: horasTrabajadas
                mensaje: Las horas deben ser mayores que cero
    IdInvalido:
      description: El ID no tiene el formato correcto
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RespuestaError"
          example:
            status: error
            message: El identificador enviado no es válido
            errors: []
    NoEncontrado:
      description: No existe un recurso con ese ID
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RespuestaError"
          example:
            status: error
            message: No se encontró el recurso solicitado
            errors: []
    ErrorInterno:
      description: Error interno del servidor
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RespuestaError"
          example:
            status: error
            message: Error interno del servidor
            errors: []

  schemas:
    # ------------------------------------------------ Modelos de datos
    Rol:
      type: object
      properties:
        _id:
          type: integer
          description: ID numérico autoincremental
          example: 1
        nombre:
          type: string
          example: Administrativo
        valorHora:
          type: number
          description: Valor de la hora normal de trabajo
          example: 4000
        createdAt:
          type: string
          format: date-time
          example: "2026-10-28T05:31:38.605Z"
        updatedAt:
          type: string
          format: date-time
          example: "2026-10-28T05:31:38.605Z"

    NuevoRol:
      type: object
      required: [nombre, valorHora]
      properties:
        nombre:
          type: string
          description: Nombre del rol (único)
          example: Gerente
        valorHora:
          type: number
          minimum: 0
          description: Valor de la hora normal de trabajo
          example: 6000

    Empleado:
      type: object
      properties:
        _id:
          type: integer
          description: ID numérico autoincremental
          example: 1
        nombre:
          type: string
          example: Juan
        apellido:
          type: string
          example: Pérez
        dni:
          type: string
          example: "40123456"
        rolId:
          $ref: "#/components/schemas/Rol"
        createdAt:
          type: string
          format: date-time
          example: "2026-10-28T05:31:38.700Z"
        updatedAt:
          type: string
          format: date-time
          example: "2026-10-28T05:31:38.700Z"

    # Al eliminar, el empleado se devuelve sin cargar el rol: rolId es solo el ID
    EmpleadoEliminado:
      type: object
      properties:
        _id:
          type: integer
          description: ID numérico autoincremental
          example: 1
        nombre:
          type: string
          example: Ana
        apellido:
          type: string
          example: Ruiz
        dni:
          type: string
          example: "30111222"
        rolId:
          type: integer
          description: Solo el ID numérico del rol (acá no se carga el rol completo)
          example: 1

    NuevoEmpleado:
      type: object
      required: [nombre, apellido, dni, rolId]
      properties:
        nombre:
          type: string
          example: Ana
        apellido:
          type: string
          example: Ruiz
        dni:
          type: string
          pattern: '^\d{7,8}$'
          description: DNI de 7 u 8 dígitos, solo números (único)
          example: "30111222"
        rolId:
          type: integer
          description: "`_id` numérico de un rol existente"
          example: 1

    RegistroHoras:
      type: object
      properties:
        _id:
          type: integer
          description: ID numérico autoincremental
          example: 1
        empleadoId:
          type: integer
          description: ID numérico del empleado
          example: 1
        fecha:
          type: string
          format: date
          description: Día trabajado, sin hora (AAAA-MM-DD)
          example: "2026-10-26"
        horasTrabajadas:
          type: number
          example: 9
        createdAt:
          type: string
          format: date-time
          example: "2026-10-28T05:31:38.800Z"
        updatedAt:
          type: string
          format: date-time
          example: "2026-10-28T05:31:38.800Z"

    NuevoRegistroHoras:
      type: object
      required: [empleadoId, fecha, horasTrabajadas]
      properties:
        empleadoId:
          type: integer
          description: "`_id` numérico de un empleado existente que tenga rol"
          example: 1
        fecha:
          type: string
          format: date
          description: Día trabajado (AAAA-MM-DD). Un empleado solo puede tener un registro por día.
          example: "2026-11-02"
        horasTrabajadas:
          type: number
          minimum: 0.01
          maximum: 24
          description: Horas trabajadas en el día (más de 0 y hasta 24). Se admiten decimales.
          example: 9

    # Detalle del pago de un registro
    CalculoPago:
      type: object
      properties:
        empleado:
          type: string
          example: Juan Pérez
        horasTrabajadas:
          type: number
          example: 9
        horasNormales:
          type: number
          description: Hasta 8 horas, pagadas al valor normal
          example: 8
        horasExtra:
          type: number
          description: Horas por encima de 8, pagadas al 150 %
          example: 1
        valorHora:
          type: number
          description: Valor por hora del rol del empleado
          example: 4000
        pagoNormal:
          type: number
          description: horasNormales × valorHora
          example: 32000
        pagoExtra:
          type: number
          description: horasExtra × valorHora × 1,5
          example: 6000
        totalPagar:
          type: number
          description: pagoNormal + pagoExtra
          example: 38000

    RegistroConCalculo:
      type: object
      properties:
        registro:
          $ref: "#/components/schemas/RegistroHoras"
        calculo:
          $ref: "#/components/schemas/CalculoPago"

    # ------------------------------ Respuestas con el formato Envelope
    RespuestaRol:
      type: object
      properties:
        status:
          type: string
          example: success
        data:
          $ref: "#/components/schemas/Rol"

    RespuestaRoles:
      type: object
      properties:
        status:
          type: string
          example: success
        data:
          type: array
          items:
            $ref: "#/components/schemas/Rol"

    RespuestaEmpleado:
      type: object
      properties:
        status:
          type: string
          example: success
        data:
          $ref: "#/components/schemas/Empleado"

    RespuestaEmpleados:
      type: object
      properties:
        status:
          type: string
          example: success
        data:
          type: array
          items:
            $ref: "#/components/schemas/Empleado"

    RespuestaEmpleadoEliminado:
      type: object
      properties:
        status:
          type: string
          example: success
        data:
          $ref: "#/components/schemas/EmpleadoEliminado"

    RespuestaRegistro:
      type: object
      properties:
        status:
          type: string
          example: success
        data:
          $ref: "#/components/schemas/RegistroConCalculo"

    RespuestaRegistros:
      type: object
      properties:
        status:
          type: string
          example: success
        data:
          type: array
          items:
            $ref: "#/components/schemas/RegistroConCalculo"

    RespuestaRegistroEliminado:
      type: object
      properties:
        status:
          type: string
          example: success
        data:
          $ref: "#/components/schemas/RegistroHoras"

    RespuestaError:
      type: object
      properties:
        status:
          type: string
          example: error
        message:
          type: string
          example: Descripción del error
        errors:
          type: array
          description: Detalle de los errores (por ejemplo, un objeto por campo inválido)
          items:
            type: object
            properties:
              campo:
                type: string
                example: horasTrabajadas
              mensaje:
                type: string
                example: Las horas deben ser mayores que cero
